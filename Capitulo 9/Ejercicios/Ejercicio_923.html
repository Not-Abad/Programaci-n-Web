<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 9.23 - CAI con Retroalimentación Variada</title>
    <link rel="stylesheet" href="../../Estilos_Globales/Style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Ejercicio 9.23: CAI con Diálogo Variado</h1>
            <p>Uso de selección aleatoria y estructura switch para mitigar la fatiga del estudiante.</p>
        </header>
       
        <main>
            <h2 id="pregunta"></h2>
            <form action="#">
                <p>
                    Respuesta: <input id="respuesta" type="number">
                    <input id="btnVerificar" type="button" value="Enviar">
                </p>
            </form>
            <p id="feedback"></p>

            <script type="text/javascript">
                var n1, n2, resultadoCorrecto;

                function generarPregunta() {
                    n1 = Math.floor(Math.random() * 9) + 1;
                    n2 = Math.floor(Math.random() * 9) + 1;
                    resultadoCorrecto = n1 * n2;
                    document.getElementById("pregunta").innerHTML = "¿Cuánto es " + n1 + " por " + n2 + "?";
                    document.getElementById("respuesta").value = "";
                }

                function obtenerMensajeCorrecto() {
                    var opcion = Math.floor(Math.random() * 4) + 1;
                    switch (opcion) {
                        case 1: return "Muy bien.";
                        case 2: return "Excelente.";
                        case 3: return "Buen trabajo.";
                        case 4: return "Siga así.";
                    }
                }

                function obtenerMensajeIncorrecto() {
                    var opcion = Math.floor(Math.random() * 4) + 1;
                    switch (opcion) {
                        case 1: return "No. Intente de nuevo.";
                        case 2: return "Equivocado. Trate una vez más.";
                        case 3: return "No se dé por vencido.";
                        case 4: return "No. Siga intentando.";
                    }
                }

                function verificar() {
                    var resp = parseInt(document.getElementById("respuesta").value);
                    if (resp === resultadoCorrecto) {
                        document.getElementById("feedback").innerHTML = "<span style='color:green;'>" + obtenerMensajeCorrecto() + "</span>";
                        generarPregunta();
                    } else {
                        document.getElementById("feedback").innerHTML = "<span style='color:red;'>" + obtenerMensajeIncorrecto() + "</span>";
                    }
                }

                function iniciar() {
                    generarPregunta();
                    document.getElementById("btnVerificar").addEventListener("click", verificar, false);
                }

                window.addEventListener("load", iniciar, false);
            </script>
        </main>

        <footer>  
            <br><br>  
            <ul><p><a href="index.html">Regresar</a></p></ul>
            <br><br><br><br><br><br><br><br><br><br><br><br>
            <hr>
            <p>Hecho por Jesús Abad Romero</p>
        </footer>
    </div>
</body>
</html>
