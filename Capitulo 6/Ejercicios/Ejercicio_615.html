<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6.15 - Mostrar números del 1 al 4</title>
    <link rel="stylesheet" href="../../Estilos_Globales/Style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Ejercicio 6.15: Mostrar Números del 1 al 4</h1>
            <p>Uso de document.writeln y document.write.</p>
        </header>
        
        <main>
            <div class="item">
                <h3>a) Usando una instrucción document.writeln:</h3>
                <script type="text/JavaScript">
                    document.writeln( "<p>1 2 3 4</p>" );
                </script>
            </div>

            <div class="item">
                <h3>b) Usando cuatro instrucciones document.write:</h3>
                <script type="text/JavaScript">
                    document.write( "1 " );
                    document.write( "2 " );
                    document.write( "3 " );
                    document.write( "4" );
                </script>
            </div>
        </main>

        <footer>   
            <br><br>  
            <ul><p><a href="index.html">Regresar</a></p></ul>
            <br><br><br><br><br><br><br><br><br><br><br><br>
            <hr>
            <p>Hecho por Jesús Abad Romero</p>
        </footer>
    </div>
</body>
</html>
