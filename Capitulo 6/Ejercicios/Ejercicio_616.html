<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6.16 - Operaciones Aritméticas</title>
    <link rel="stylesheet" href="../../Estilos_Globales/Style.css">
    <script type="text/JavaScript">
        var n1Val = window.prompt( "Escriba el primer número:", "0" );
        var n2Val = window.prompt( "Escriba el segundo número:", "0" );

        var n1 = parseFloat( n1Val );
        var n2 = parseFloat( n2Val );

        var suma = n1 + n2;
        var producto = n1 * n2;
        var diferencia = n1 - n2;
        var cociente = n2 !== 0 ? ( n1 / n2 ) : "Indefinido (división entre cero)";
    </script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Ejercicio 6.16: Operaciones Aritméticas</h1>
            <p>Suma, producto, diferencia y cociente de dos números.</p>
        </header>
        
        <main>
            <div class="detalles">
                <script type="text/JavaScript">
                    document.writeln( "<p><strong>Primer número:</strong> " + n1 + "</p>" );
                    document.writeln( "<p><strong>Segundo número:</strong> " + n2 + "</p>" );
                    document.writeln( "<p><strong>Suma:</strong> " + suma + "</p>" );
                    document.writeln( "<p><strong>Producto:</strong> " + producto + "</p>" );
                    document.writeln( "<p><strong>Diferencia:</strong> " + diferencia + "</p>" );
                    document.writeln( "<p><strong>Cociente:</strong> " + cociente + "</p>" );
                </script>
            </div>
        </main>

        <footer>   
            <br><br>  
            <ul><p><a href="index.html">Regresar</a></p></ul>
            <br><br><br><br><br><br><br><br><br><br><br><br>
            <hr>
            <p>Hecho por Jesús Abad Romero</p>
        </footer>
    </div>
</body>
</html>
