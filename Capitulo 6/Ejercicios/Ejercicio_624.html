<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6.24 - Cuadrados y Cubos</title>
    <link rel="stylesheet" href="../../Estilos_Globales/Style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Ejercicio 6.24: Tabla de Cuadrados y Cubos</h1>
            <p>Tabla generada con JavaScript para los valores del 0 al 5.</p>
        </header>
        
        <main>
            <table border="1" style="margin: 0 auto; text-align: center; border-collapse: collapse; width: 60%;">
                <thead>
                    <tr>
                        <th>Número</th>
                        <th>Cuadrado</th>
                        <th>Cubo</th>
                    </tr>
                </thead>
                <tbody>
                    <script type="text/JavaScript">
                        for ( var i = 0; i <= 5; i++ ) {
                            document.writeln( "<tr>" );
                            document.writeln( "<td>" + i + "</td>" );
                            document.writeln( "<td>" + ( i * i ) + "</td>" );
                            document.writeln( "<td>" + ( i * i * i ) + "</td>" );
                            document.writeln( "</tr>" );
                        }
                    </script>
                </tbody>
            </table>
        </main>

        <footer>   
            <br><br>  
            <ul><p><a href="index.html">Regresar</a></p></ul>
            <br><br><br><br><br><br><br><br><br><br><br><br>
            <hr>
            <p>Hecho por Jesús Abad Romero</p>
        </footer>
    </div>
</body>
</html>
