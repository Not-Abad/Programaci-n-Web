<!DOCTYPE html>

<!-- Fig. 2.12: tabla l.html-->
<!-- Creación de una tabla basica-->
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Una tabla de HTML5 simple</title>
    </head>

    <body>
        <!-- La etiqueta <table> abre una tabla-->
        <table border = "1">
            <caption><strong>Tabla de frutas (1era columna) y 
                sus precios (2da columna)</strong></caption>
            
            <thead>
                <tr>
                    <th>Fruta</th>
                    <th>Precio</th>
                </tr>
            </thead>

            <tfoot>
                <tr>
                    <th>Total</th>
                    <th>$3.75</th>
                </tr>
            </tfoot>

            <tbody>
                <tr>
                    <td>Manzana</td>
                    <td>$0.25</td>
                </tr>
                <tr>
                    <td>Pl&aacute;tano</td>
                    <td>$1.00</td>
                </tr>
                <tr>
                    <td>Pi&ntilde;a;</td>
                    <td>$2.00</td>
                </tr>
        </table>
        <br><br><ul><p><a href = "index.html">Regresar</a></p></ul><br><br><br><br>
    </body>

    <footer>
        <hr> <!-- Inserta una regla horizontal-->
        <p>Hecho por Jes&uacute;s Abad Romero </p>
    </footer>
</html>
