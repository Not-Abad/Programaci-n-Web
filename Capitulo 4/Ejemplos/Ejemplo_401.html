<!DOCTYPE html>

<!-- Fig. 4.1: enlinea.html-->
<!-- Uso de estilos en línea-->
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Estilos de l&iacute;nea</title>
    </head>
    
    <body>
        <p>Este texto no tiene aplicado ningu&uacute;n estilo.</p>

        <!-- El atributo style nos permite declarar -->
        <!-- estilos en línea. Debemos separar varias-->
        <!-- propiedades de style con un punto y coma -->

        <p style = "font-size: 20pt;">Este texto tiene aplicado el estilo
            <em>color</em>, para que sea de 
            20pt y de color azul cielo profundo. </p>
        <footer>  

            <br><br>  

            <ul><p><a href = "index.html">Regresar</a></p></ul>

            <br><br><br><br><br><br><br><br><br><br><br><br>

       

            <hr> <!-- Inserta una regla horizontal-->

            <p>Hecho por Jes&uacute;s Abad Romero </p>

        </footer>

    </body>
</html>
