<!DOCTYPE html>

<!-- Fig. 5.7: trazotexto.html -->
<!-- Trazo de texto en CSS3. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Trazo de texto</title>
      <style type = "text/css">
         h1
         {
            color: lightcyan;
            -webkit-text-stroke: 2px black; /* prefijo de proveedor */
            font-size: 500%; /* aumenta el tamaño de la fuente */
         }
      </style>
   </head>
   <body>
      <h1>Trazo de texto</h1>

      <footer>   
         <br><br>  
         <ul><p><a href = "index.html">Regresar</a></p></ul>
         <br><br><br><br><br><br><br><br><br><br><br><br>
      
         <hr> <!-- Inserta una regla horizontal-->
         <p>Hecho por Jes&uacute;s Abad Romero </p>
      </footer>
   </body>
</html>
