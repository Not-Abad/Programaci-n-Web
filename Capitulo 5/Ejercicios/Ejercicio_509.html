<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5.9 - Animación en patrón cuadrado</title>
    <style>

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fc;
            color: #333;
            margin: 0;
            padding: 20px 40px;
        }
        header {
            border-bottom: 2px solid #2b5797;
            padding-bottom: 10px;
            margin-bottom: 25px;
        }
        h1 {
            color: #2b5797;
            margin-bottom: 5px;
        }
        h2 {
            color: #444;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            max-width: 900px;
            margin: 0 auto;
        }

        .escenario {
            position: relative;
            width: 400px;
            height: 400px;
            border: 3px dashed #2b5797;
            margin: 30px auto;
            background-color: #f0f4f8;
            border-radius: 8px;
        }
        .objeto-cuadrado {
            position: absolute;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            animation: moverCuadrado 4s infinite linear;
        }

        @keyframes moverCuadrado {
            0% {
                top: 0px;
                left: 0px;
            }
            25% {
                top: 0px;
                left: 340px;
            }
            50% {
                top: 340px;
                left: 340px;
            }
            75% {
                top: 340px;
                left: 0px;
            }
            100% {
                top: 0px;
                left: 0px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Ejercicio 5.9: Animación infinita en patrón cuadrado</h1>
            <p>Cree una animación infinita de un elemento que se mueva en un patrón cuadrado.</p>
        </header>

        <main>
            <div class="escenario">
                <div class="objeto-cuadrado">Móvil</div>
            </div>
        </main>

    <footer>   
         <br><br>  
         <ul><p><a href = "index.html">Regresar</a></p></ul>
         <br><br><br><br><br><br><br><br><br><br><br><br>
      
         <hr> <!-- Inserta una regla horizontal-->
         <p>Hecho por Jes&uacute;s Abad Romero </p>
    </footer>
    </div>
</body>
</html>
