<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 8.1 - Repetición controlada por contador (while)</title>
    <link rel="stylesheet" href="../../Estilos_Globales/Style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Figura 8.1: ContadorWhile.html</h1>
            <p>Repetición controlada por un contador utilizando la instrucción while.</p>
        </header>
        
        <main>
            <script type="text/JavaScript">
                var contador = 1; // inicialización

                while ( contador <= 7 ) // condición de repetición
                {
                    document.writeln( "<p style='font-size: " +
                        contador + "ex'>Tamaño de fuente de HTML5 " + contador + "ex</p>" );
                    ++contador; // incremento
                } // fin de while
            </script>
        </main>

        <footer>   
            <br><br>  
            <ul><p><a href="index.html">Regresar</a></p></ul>
            <br><br><br><br><br><br><br><br><br><br><br><br>
            <hr>
            <p>Hecho por Jesús Abad Romero</p>
        </footer>
    </div>
</body>
</html>
