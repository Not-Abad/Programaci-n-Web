<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 8.9 - Repetición do...while</title>
    <link rel="stylesheet" href="../../Estilos_Globales/Style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Figura 8.9: PruebaDoWhile.html</h1>
            <p>Uso de la instrucción de repetición do...while.</p>
        </header>
        
        <main>
            <script type="text/JavaScript">
                var contador = 1;

                do {
                    document.writeln( "<h" + contador + ">Éste es " +
                        "un encabezado de nivel h" + contador + "</h" +
                        contador + ">" );
                    ++contador;
                } while ( contador <= 6 );
            </script>
        </main>

        <footer>   
            <br><br>  
            <ul><p><a href="index.html">Regresar</a></p></ul>
            <br><br><br><br><br><br><br><br><br><br><br><br>
            <hr>
            <p>Hecho por Jesús Abad Romero</p>
        </footer>
    </div>
</body>
</html>
