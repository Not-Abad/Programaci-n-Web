<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 8.5 - Sumar enteros pares del 2 al 100</title>
    <link rel="stylesheet" href="../../Estilos_Globales/Style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Figura 8.5: Suma.html</h1>
            <p>Suma de los enteros pares del 2 al 100 con la estructura de repetición for.</p>
        </header>
        
        <main>
            <script type="text/JavaScript">
                var suma = 0;

                for ( var numero = 2; numero <= 100; numero += 2 )
                    suma += numero;

                document.writeln( "<h2>La suma de los enteros pares del 2 al 100 es " + suma + "</h2>" );
            </script>
        </main>

        <footer>   
            <br><br>  
            <ul><p><a href="index.html">Regresar</a></p></ul>
            <br><br><br><br><br><br><br><br><br><br><br><br>
            <hr>
            <p>Hecho por Jesús Abad Romero</p>
        </footer>
    </div>
</body>
</html>
