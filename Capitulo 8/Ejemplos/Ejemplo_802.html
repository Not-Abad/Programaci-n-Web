<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 8.2 - Repetición controlada por contador (for)</title>
    <link rel="stylesheet" href="../../Estilos_Globales/Style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Figura 8.2: ContadorFor.html</h1>
            <p>Repetición controlada por contador con la instrucción for.</p>
        </header>
        
        <main>
            <script type="text/JavaScript">
                // La inicialización, condición de repetición e
                // incremento se incluyen en el encabezado de
                // la instrucción for.
                for ( var contador = 1; contador <= 7; ++contador )
                    document.writeln( "<p style='font-size: " +
                        contador + "ex'>Tamaño de fuente de HTML5 " + contador + "ex</p>" );
            </script>
        </main>

        <footer>   
            <br><br>  
            <ul><p><a href="index.html">Regresar</a></p></ul>
            <br><br><br><br><br><br><br><br><br><br><br><br>
            <hr>
            <p>Hecho por Jesús Abad Romero</p>
        </footer>
    </div>
</body>
</html>
