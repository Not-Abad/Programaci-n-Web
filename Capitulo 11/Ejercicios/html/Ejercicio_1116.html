<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 11.16 - Cadenas que terminan con "ed"</title>
    <link rel="stylesheet" href="../../../Estilos_Globales/Style.css">
    <link rel="stylesheet" href="../Estilos/estilo_ejercicios.css">
    <script src="../Js/Ejercicio_1116.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Ejercicio 11.16: Filtrado de cadenas terminadas en <code class="inline">"ed"</code></h1>
            <p>Lectura de una serie de cadenas e impresión en <code class="inline">textarea</code> de las que finalizan en <code class="inline">"ed"</code>.</p>
        </header>
       
        <main>
            <div class="item">
                <label for="cadenasEntrada"><strong>Serie de cadenas (una por línea):</strong></label>
                <textarea id="cadenasEntrada" rows="6">pared
ventana
red
techo
césped
puerta
huésped</textarea>
                <input id="btnFiltrarEd" type="button" value="Filtrar cadenas con 'ed'">
                <textarea id="cadenasSalida" rows="5" readonly></textarea>
            </div>
        </main>

        <footer>  
            <br><br>  
            <ul><p><a href="index.html">Regresar</a></p></ul>
            <br><br><br><br><br><br><br><br><br><br><br><br>
            <hr>
            <p>Hecho por Jesús Abad Romero</p>
        </footer>
    </div>
</body>
</html>
