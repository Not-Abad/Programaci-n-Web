    <div class="container">
        <header>
            <h1>Ejercicio 11.2: Fechas y horas en relación con la hora actual</h1>
            <p>Despliegue de diálogos de alerta utilizando el objeto <code class="inline">Date</code>.</p>
        </header>
       
        <main>
            <div class="item">
                <p class="enunciado">Seleccione una opción para mostrar su fecha y hora correspondiente:</p>
                <input id="btnAhora" type="button" value="Ahora">
                <input id="btnAyer" type="button" value="Ayer (hace 24 horas)">
                <input id="btnDiezAnios" type="button" value="Hace diez años">
                <input id="btnUnaSemana" type="button" value="En una semana">
            </div>
        </main>
