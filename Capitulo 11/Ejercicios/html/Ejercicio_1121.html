<!DOCTYPE html>

<head>

    <title>Ejercicio 11.21 - Cadenas de tres letras</title>

<body>
    <div class="container">
        <header>
            <h1>Ejercicio 11.21: Cadenas de tres letras desde una palabra de cinco</h1>
            <p>Generación de todas las permutaciones de longitud 3 derivadas de una palabra de 5 caracteres.</p>
        </header>
       
        <main>
            <div class="item">
                <form action="#">
                    <label for="palabraCinco">Palabra de 5 letras: </label>
                    <input id="palabraCinco" type="text" maxlength="5" value="trigo" style="width: 120px;">
                    <input id="btnGenerarTres" type="button" value="Generar cadenas de 3 letras">
                </form>
                <textarea id="salidaTresLetras" rows="10" readonly></textarea>
            </div>
        </main>

        <footer>  
            <br><br>
