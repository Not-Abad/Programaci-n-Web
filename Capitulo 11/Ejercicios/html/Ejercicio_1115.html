<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 11.15 - Cadenas que comienzan con "b"</title>
    <link rel="stylesheet" href="../../../Estilos_Globales/Style.css">
    <link rel="stylesheet" href="../Estilos/estilo_ejercicios.css">
    <script src="../Js/Ejercicio_1115.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Ejercicio 11.15: Filtrado de cadenas iniciales con <code class="inline">"b"</code></h1>
            <p>Lectura de una serie de cadenas e impresión en <code class="inline">textarea</code> de las que empiezan con <code class="inline">"b"</code>.</p>
        </header>
       
        <main>
            <div class="item">
                <label for="cadenasEntrada"><strong>Serie de cadenas (una por línea):</strong></label>
                <textarea id="cadenasEntrada" rows="6">barco
avión
bicicleta
tren
ballena
automóvil
bosque</textarea>
                <input id="btnFiltrarB" type="button" value="Filtrar cadenas con 'b'">
                <textarea id="cadenasSalida" rows="5" readonly></textarea>
            </div>
        </main>

        <footer>  
            <br><br>  
            <ul><p><a href="index.html">Regresar</a></p></ul>
            <br><br><br><br><br><br><br><br><br><br><br><br>
            <hr>
            <p>Hecho por Jesús Abad Romero</p>
        </footer>
    </div>
</body>
</html>
