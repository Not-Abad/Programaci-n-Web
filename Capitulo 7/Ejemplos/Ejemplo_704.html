<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 7.14 - Preincremento y Postincremento</title>
    <link rel="stylesheet" href="../../Estilos_Globales/Style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Ejercicio 7.14: Preincremento y Postincremento</h1>
            <p>Demostración de la diferencia entre el operador de postincremento (c++) y preincremento (++c).</p>
        </header>
        
        <main>
            <script type="text/JavaScript">
                var c;

                // Demostración de postincremento
                c = 5;
                document.writeln( "<h3>Postincremento</h3>" );
                document.writeln( "<p>Valor inicial: " + c + "</p>" );
                document.writeln( "<p>Valor al evaluar c++: " + c++ + "</p>" );
                document.writeln( "<p>Valor final después de c++: " + c + "</p>" );

                // Demostración de preincremento
                c = 5;
                document.writeln( "<h3>Preincremento</h3>" );
                document.writeln( "<p>Valor inicial: " + c + "</p>" );
                document.writeln( "<p>Valor al evaluar ++c: " + ++c + "</p>" );
                document.writeln( "<p>Valor final después de ++c: " + c + "</p>" );
            </script>
        </main>

        <footer>   
            <br><br>  
            <ul><p><a href="index.html">Regresar</a></p></ul>
            <br><br><br><br><br><br><br><br><br><br><br><br>
            <hr>
            <p>Hecho por Jesús Abad Romero</p>
        </footer>
    </div>
</body>
</html>
